<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>成长小队 · 口袋终端模拟器</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;color:#e9f4e8;background:radial-gradient(circle at 50% 15%,#284d5a,#0d1e2b 55%,#08141e);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.shell{width:min(1050px,100%);display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center}.device{position:relative;aspect-ratio:1/1.05;background:url('./assets/assistant/pocket-terminal.webp') center/contain no-repeat;filter:drop-shadow(0 28px 38px rgba(0,0,0,.35))}.screen{position:absolute;left:27%;right:27%;top:24%;height:28%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4%;color:#12343c;text-align:center}.screen small{font-size:clamp(8px,1vw,13px);font-weight:800}.screen strong{margin:4px 0;font-size:clamp(12px,1.8vw,23px);line-height:1.15}.screen span{font-size:clamp(7px,.8vw,11px)}.buttons{position:absolute;left:28%;right:28%;bottom:21%;display:grid;grid-template-columns:repeat(3,1fr);gap:11%;}.buttons button{aspect-ratio:1;border:0;border-radius:50%;opacity:.01;cursor:pointer}.panel{padding:28px;border:1px solid rgba(255,255,255,.15);border-radius:26px;background:rgba(10,28,38,.72);backdrop-filter:blur(14px)}.panel span{color:#efba72;font-size:12px;font-weight:900;letter-spacing:.1em}.panel h1{margin:10px 0 6px;font-size:32px}.panel p{margin:0 0 18px;color:#afc6c3;line-height:1.6}.pair{display:grid;gap:9px}.pair input{width:100%;padding:15px;border:1px solid #78908c;border-radius:14px;color:white;background:#162e39;font-size:25px;font-weight:900;letter-spacing:.35em;text-align:center}.panel button{min-height:48px;border:0;border-radius:14px;color:#123238;background:#e6b66f;font-weight:900;cursor:pointer}.hint{display:block;margin-top:12px;color:#91aaa8;font-size:11px}.error{margin-top:12px;color:#ffba9d}.live-actions{display:none;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}.live-actions button:nth-child(1){background:#7fb68b}.live-actions button:nth-child(2){background:#e1ba64}.live-actions button:nth-child(3){background:#c8754b;color:white}@media(max-width:760px){body{padding:12px}.shell{grid-template-columns:1fr}.device{order:2}.panel{padding:20px}.panel h1{font-size:25px}}
</style></head><body><main class="shell"><div class="device"><div class="screen" id="screen"><small>成长小队</small><strong>等待连接</strong><span>请让家长生成 6 位码</span></div><div class="buttons"><button data-choice="start" aria-label="开始"></button><button data-choice="later" aria-label="稍后"></button><button data-choice="help" aria-label="求助"></button></div></div><section class="panel"><span>硬件协议验证工具</span><h1>口袋终端模拟器</h1><p>它使用和真机相同的专属令牌与接口。模拟器通过，不代表屏幕、按键和麦克风真机已经验收。</p><div class="pair" id="pair"><input id="code" inputmode="numeric" maxlength="6" placeholder="000000" aria-label="六位连接码"/><button id="connect">连接终端</button></div><div class="live-actions" id="live"><button data-choice="start">绿色 · 开始</button><button data-choice="later">黄色 · 稍后</button><button data-choice="help">铜色 · 陪我</button></div><small class="hint">令牌只保存在这个浏览器中；绑定后无法切换孩子。</small><div class="error" id="error" role="status"></div></section></main><script>
const base='./api/v2/device';const key='growing-squad:terminal-token:v1';const $=id=>document.getElementById(id);let token=localStorage.getItem(key)||'';
async function call(path,options={}){const res=await fetch(base+path,{...options,headers:{Accept:'application/json',...(options.body?{'Content-Type':'application/json'}:{}),...(token?{Authorization:'Bearer '+token}:{})}});const data=await res.json();if(!res.ok)throw new Error(data.error||'暂时无法连接');return data}
function show(today,profile){$('screen').innerHTML=`<small>${profile.name} · ${today.context}</small><strong>${today.title}</strong><span>${today.subtitle||'一次只做一件'}</span>`;$('pair').style.display='none';$('live').style.display='grid';$('error').textContent=''}
async function refresh(){try{const data=await call('/today');show(data.today,data.profile)}catch(e){$('error').textContent=e.message;if(e.message.includes('失效')){token='';localStorage.removeItem(key)}}}
$('connect').onclick=async()=>{try{const data=await call('/pair',{method:'POST',body:JSON.stringify({code:$('code').value,deviceName:'浏览器终端模拟器'})});token=data.token;localStorage.setItem(key,token);await refresh()}catch(e){$('error').textContent=e.message}}
async function choose(kind){try{if(kind==='help')await call('/help',{method:'POST',body:'{}'});else await call('/choice',{method:'POST',body:JSON.stringify({choice:kind})});await refresh()}catch(e){$('error').textContent=e.message}}
document.querySelectorAll('[data-choice]').forEach(button=>button.onclick=()=>choose(button.dataset.choice));if(token)refresh();
</script></body></html>
