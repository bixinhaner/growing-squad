name: Review workspace
on:
  workflow_dispatch:
  push:
    branches: [feat/trustworthy-growth-comfort]
    paths: [.github/workflows/review-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assemble tracked review sources
        shell: bash
        run: |
          # Snapshot for the tonight right-panel layout verification.
          # Tracked application sources only: no credentials, databases or installed dependencies.
          git ls-files -z -- src public tests scripts docs .github package.json package-lock.json vite.config.js eslint.config.js playwright.config.js playwright.production.config.js index.html README.md .gitignore 'server/*.mjs' 'server/*.test.js' | tar --null -T - -czf /tmp/review-sources.tar.gz
          git ls-files -s > /tmp/source-index.txt
          git rev-parse HEAD > /tmp/source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: review-sources
          path: |
            /tmp/review-sources.tar.gz
            /tmp/source-index.txt
            /tmp/source-commit.txt
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
