name: Review workspace
on:
  push:
    branches: [feat/trustworthy-growth-comfort]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Assemble isolated review workspace
        shell: bash
        run: |
          # Explicit source paths only: never include Git credentials, environments or family databases.
          tar -czf /tmp/review-workspace.tar.gz src public tests scripts node_modules server/*.mjs server/*.test.js package.json package-lock.json vite.config.js eslint.config.js playwright.config.js playwright.production.config.js index.html README.md
      - uses: actions/upload-artifact@v4
        with:
          name: review-workspace
          path: /tmp/review-workspace.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
